name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check syntax and run offline tests
        env:
          PYTHONUTF8: '1'
        run: python scripts/run_offline_checks.py
      - name: Check PowerShell entry points and recovery with mocked services
        shell: pwsh
        run: ./scripts/powershell/tests/Test-ProjectScripts.ps1
