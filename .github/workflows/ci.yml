name: Physical AI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Gazebo Python offline checks
    defaults:
      run:
        working-directory: gazebo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check syntax and run offline tests
        env:
          PYTHONUTF8: '1'
        run: python scripts/run_offline_checks.py
      - name: Check the submission repository layout
        working-directory: .
        run: python tests/test_layout.py
      - name: Check all commands without services
        working-directory: .
        shell: pwsh
        run: ./tests/Test-Project.ps1
