[project]
name = "roboops-workshop"
version = "1.0.0"
description = "A CPU-only, two-hour RoboOps workshop using LeRobot and PushT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gym-pusht==0.1.6",
  "huggingface-hub>=1.6,<2",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "jupyterlab>=4.4,<5",
  "lerobot[dataset,pusht]==0.6.1",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<2.3",
  "pyyaml>=6.0,<7",
  "pytest>=8.4,<9",
  "ruff>=0.14,<0.15",
  "setuptools>=71,<81",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboops"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
